name: static-layering

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 第一步：检查器身份校验。文件自称的版本/来源仓/来源提交必须与 tools/CHECKER.lock 一致，
      # 不一致就说明工具被换过或锁文件没跟着改，直接失败。
      - name: Verify checker lock
        run: python3 tools/check_layering.py --version --lock tools/CHECKER.lock

      # 第二步：扫描。ERROR 必须为 0；WARN 只打印，不判失败。
      # --glue-max-lines 是棘轮：src/app/main.c 原来 1277 行、上限 1280（见 PATCHES.md §20）。
      # 2026-11-19 为板级 bring-up 的 ADC/PWM/GPIO 命令处理临时抬到 1500，
      # 原因与"收尾后必须拆出 main.c、再把上限压回当时行数"写在 PATCHES.md §27.5。
      # 放宽必须改这一行，让它留在 diff 里被看见。
      - name: Four-layer static check
        run: python3 tools/check_layering.py . --glue-max-lines 1500
