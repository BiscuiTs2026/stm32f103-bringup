name: static-layering

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 第一步：检查器身份校验。文件自称的版本/来源仓/来源提交必须与 tools/CHECKER.lock 一致，
      # 不一致就说明工具被换过或锁文件没跟着改，直接失败。
      - name: Verify checker lock
        run: python3 tools/check_layering.py --version --lock tools/CHECKER.lock

      # 第二步：扫描。ERROR 必须为 0；WARN 只打印，不判失败。
      # 2026-11-19 起不再传 --glue-max-lines：3.3.1 里行数规则已降为 WARN（默认 200），
      # 只作体积兜底；继续传 1700 等于把 main.c 的行数债藏起来。
      # 存量命中记在 TECH_DEBT.md，按拆分进度消除（PATCHES.md §36）。
      - name: Four-layer static check
        run: python3 tools/check_layering.py .
