name: static-layering

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 第一步：检查器身份校验。文件自称的版本/来源仓/来源提交必须与 tools/CHECKER.lock 一致，
      # 不一致就说明工具被换过或锁文件没跟着改，直接失败。
      - name: Verify checker lock
        run: python3 tools/check_layering.py --version --lock tools/CHECKER.lock

      # 第二步：扫描。ERROR 必须为 0；WARN 只打印，不判失败。
      # 闸门按 `src/app/main.c` 的实测行数设定，只降不升：
      # 当前实测 86 行，闸门 86——86 是实测值、无余量，再增一行即红（2026-11-20 收到 86）。
      # 存量与清账记录见 TECH_DEBT.md（PATCHES.md §37）。
      - name: Four-layer static check
        run: python3 tools/check_layering.py . --glue-max-lines 86
