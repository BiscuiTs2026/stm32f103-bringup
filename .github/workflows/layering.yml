name: static-layering

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 第一步：检查器身份校验。文件自称的版本/来源仓/来源提交必须与 tools/CHECKER.lock 一致，
      # 不一致就说明工具被换过或锁文件没跟着改，直接失败。
      - name: Verify checker lock
        run: python3 tools/check_layering.py --version --lock tools/CHECKER.lock

      # 第二步：扫描。ERROR 必须为 0；WARN 只打印，不判失败。
      # --glue-max-lines 1280 是棘轮：src/app/main.c 当前 1277 行代码，
      # 是"功能还没回灌成 pm_* 契约"的已知状态（见 PATCHES.md §20）。
      # 放宽必须改这一行，让它留在 diff 里被看见。
      - name: Four-layer static check
        run: python3 tools/check_layering.py . --glue-max-lines 1280
